# Fire-Scout monitoring topic inventory and per-topic expectations.

/monitoring/topic_rate_monitor_node:
  ros__parameters:
    # Sliding window size (seconds) used to estimate message rates.
    window_sec: 5.0
    # Check loop frequency for evaluating all monitored topics.
    check_rate_hz: 2.0

    # Topics monitored for publication rate.
    monitored_topics:
      - /robot1/scan                 # Robot1 lidar scan stream.
      - /robot2/scan                 # Robot2 lidar scan stream.
      - /robot3/scan                 # Robot3 lidar scan stream.
      - /robot1/odom                 # Robot1 odometry stream.
      - /robot2/odom                 # Robot2 odometry stream.
      - /robot3/odom                 # Robot3 odometry stream.
      - /robot1/map                  # Robot1 local SLAM map stream.
      - /robot2/map                  # Robot2 local SLAM map stream.
      - /robot3/map                  # Robot3 local SLAM map stream.
      - /map                         # Global merged map stream.
      - /mapping/map_merge_status    # Map merge status heartbeat.
      - /robot1/camera/image_raw     # Robot1 RGB camera stream.
      - /robot2/camera/image_raw     # Robot2 RGB camera stream.
      - /robot3/camera/image_raw     # Robot3 RGB camera stream.
      - /robot1/fire_sensor_alert    # Robot1 physical sensor heartbeat.
      - /robot2/fire_sensor_alert    # Robot2 physical sensor heartbeat.
      - /robot3/fire_sensor_alert    # Robot3 physical sensor heartbeat.
      - /robot1/fusion_decision      # Robot1 fused hybrid decision stream.
      - /robot2/fusion_decision      # Robot2 fused hybrid decision stream.
      - /robot3/fusion_decision      # Robot3 fused hybrid decision stream.
      - /robot1/camera_detections    # Robot1 Jetson inference output.
      - /robot2/camera_detections    # Robot2 Jetson inference output.
      - /robot3/camera_detections    # Robot3 Jetson inference output.

    # Required expected publication rates (Hz), one-to-one with monitored_topics.
    expected_rates_hz:
      - 10.0                         # /robot1/scan expected at 10 Hz.
      - 10.0                         # /robot2/scan expected at 10 Hz.
      - 10.0                         # /robot3/scan expected at 10 Hz.
      - 10.0                         # /robot1/odom expected at 10 Hz.
      - 10.0                         # /robot2/odom expected at 10 Hz.
      - 10.0                         # /robot3/odom expected at 10 Hz.
      - 1.0                          # /robot1/map expected at 1 Hz.
      - 1.0                          # /robot2/map expected at 1 Hz.
      - 1.0                          # /robot3/map expected at 1 Hz.
      - 1.0                          # /map expected at 1 Hz.
      - 1.0                          # /mapping/map_merge_status expected at 1 Hz.
      - 15.0                         # /robot1/camera/image_raw expected at 15 Hz.
      - 15.0                         # /robot2/camera/image_raw expected at 15 Hz.
      - 15.0                         # /robot3/camera/image_raw expected at 15 Hz.
      - 2.0                          # /robot1/fire_sensor_alert expected at 2 Hz.
      - 2.0                          # /robot2/fire_sensor_alert expected at 2 Hz.
      - 2.0                          # /robot3/fire_sensor_alert expected at 2 Hz.
      - 2.0                          # /robot1/fusion_decision expected at 2 Hz.
      - 2.0                          # /robot2/fusion_decision expected at 2 Hz.
      - 2.0                          # /robot3/fusion_decision expected at 2 Hz.
      - 5.0                          # /robot1/camera_detections expected at 5 Hz.
      - 5.0                          # /robot2/camera_detections expected at 5 Hz.
      - 5.0                          # /robot3/camera_detections expected at 5 Hz.

