/monitoring/latency_monitor_node:
  ros__parameters:
    # Topics monitored for latency checks (header-bearing topics only).
    monitored_topics:
      - /robot1/scan                 # Robot1 lidar scan latency.
      - /robot2/scan                 # Robot2 lidar scan latency.
      - /robot3/scan                 # Robot3 lidar scan latency.
      - /robot1/odom                 # Robot1 odom latency.
      - /robot2/odom                 # Robot2 odom latency.
      - /robot3/odom                 # Robot3 odom latency.
      - /robot1/map                  # Robot1 local map latency.
      - /robot2/map                  # Robot2 local map latency.
      - /robot3/map                  # Robot3 local map latency.
      - /map                         # Global merged map latency.
      - /robot1/camera/image_raw     # Robot1 camera image latency.
      - /robot2/camera/image_raw     # Robot2 camera image latency.
      - /robot3/camera/image_raw     # Robot3 camera image latency.
      - /robot1/fire_sensor_alert    # Robot1 sensor alert heartbeat age.
      - /robot2/fire_sensor_alert    # Robot2 sensor alert heartbeat age.
      - /robot3/fire_sensor_alert    # Robot3 sensor alert heartbeat age.
      - /robot1/camera_detections    # Robot1 camera inference latency.
      - /robot2/camera_detections    # Robot2 camera inference latency.
      - /robot3/camera_detections    # Robot3 camera inference latency.

    # Per-topic-type maximum transport latency (ms).
    scan_max_latency_ms: 200.0       # LaserScan max allowed latency.
    odom_max_latency_ms: 100.0       # Odometry max allowed latency.
    map_max_latency_ms: 2000.0       # OccupancyGrid max allowed latency.
    camera_max_latency_ms: 200.0     # Camera image/inference max allowed latency.
    sensor_alert_max_latency_ms: 500.0  # Fire sensor alert max allowed latency.

