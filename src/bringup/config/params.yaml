/**:
  ros__parameters:
    use_sim_time: true

# Obstacle avoidance tuning (cmd_vel_safety_node)
cmd_vel_safety_node:
  ros__parameters:
    stop_distance_m: 0.7
    slow_distance_m: 1.5
    front_angle_deg: 60.0
    avoidance_turn_speed: 1.25
    escape_reverse_speed: 0.28
    min_avoid_duration_sec: 1.0
    max_avoid_duration_sec: 3.5
    max_recovery_duration_sec: 5.0
    max_stuck_rotations: 4
    stuck_position_threshold: 0.02
    stuck_check_period_sec: 1.5
    all_robot_ids: ['robot1', 'robot2', 'robot3']
    robot_repulsion_distance_m: 1.3
    robot_repulsion_stop_m: 0.8
