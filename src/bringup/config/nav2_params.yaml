/**:
  ros__parameters:
    use_sim_time: true

robot1:
  controller_server:
    ros__parameters:
      use_sim_time: true
      controller_frequency: 5.0
      min_x_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.2
        movement_time_allowance: 10.0
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25
        stateful: true
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 20
        model_dt: 0.1
        batch_size: 500
        vx_max: 0.6
        vx_min: -0.35
        wz_max: 1.6
        iteration_count: 1
        prune_distance: 1.7
        transform_tolerance: 0.1
        temperature: 0.3
        gamma: 0.015
        motion_model: "DiffDrive"
        critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic:
          enabled: true
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_weight: 5.0
        GoalAngleCritic:
          enabled: true
          cost_weight: 3.0
        PreferForwardCritic:
          enabled: true
          cost_weight: 5.0
        CostCritic:
          enabled: true
          cost_weight: 3.81
          near_collision_cost: 253
          critical_cost: 300.0
        PathAlignCritic:
          enabled: true
          cost_weight: 14.0
          max_path_occupancy_ratio: 0.05
        PathFollowCritic:
          enabled: true
          cost_weight: 5.0
        PathAngleCritic:
          enabled: true
          cost_weight: 2.0

  planner_server:
    ros__parameters:
      use_sim_time: true
      expected_planner_frequency: 1.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  bt_navigator:
    ros__parameters:
      use_sim_time: true
      global_frame: robot1/map
      robot_base_frame: robot1/base_link
      odom_topic: /robot1/odom
      bt_loop_duration: 10
      default_server_timeout: 20
      navigators: ["navigate_to_pose", "navigate_through_poses"]
      navigate_to_pose:
        plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      navigate_through_poses:
        plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      bt_search_directories:
        - $(find-pkg-share nav2_bt_navigator)/behavior_trees

  behavior_server:
    ros__parameters:
      use_sim_time: true
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 5.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors::DriveOnHeading"
      wait:
        plugin: "nav2_behaviors::Wait"
      local_frame: robot1/odom
      global_frame: robot1/map
      robot_base_frame: robot1/base_link
      transform_tolerance: 0.1
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.6
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.0

  waypoint_follower:
    ros__parameters:
      use_sim_time: true
      loop_rate: 5
      stop_on_failure: false

  velocity_smoother:
    ros__parameters:
      use_sim_time: true
      smoothing_frequency: 10.0
      scale_velocities: false
      feedback: "OPEN_LOOP"
      max_velocity: [0.6, 0.0, 1.6]
      min_velocity: [0.0, 0.0, -1.6]
      max_accel: [1.5, 0.0, 3.0]
      max_decel: [-1.5, 0.0, -3.0]
      odom_topic: /robot1/odom
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        global_frame: robot1/odom
        robot_base_frame: robot1/base_link
        update_frequency: 3.0
        publish_frequency: 0.5
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.1
        robot_radius: 0.25
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /robot1/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.8
          cost_scaling_factor: 3.0
        always_send_full_costmap: false

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: true
        global_frame: robot1/map
        robot_base_frame: robot1/base_link
        update_frequency: 0.5
        publish_frequency: 0.5
        resolution: 0.1
        robot_radius: 0.25
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
          map_topic: /robot1/map
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /robot1/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.9
          cost_scaling_factor: 3.0
        always_send_full_costmap: false

